<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalistycznie Przez Życie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://giscus.app/client.js" async></script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/newsletter.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Minimalistycznie Przez Życie</h1>
            <p>Małe przygody w wielkim świecie</p>
        </header>

        <nav>
            <!-- CMS_NAV_START -->
            <ul>
                <li><a href="#home" data-page="home" id="nav-home" class="active">Strona główna</a></li>
                <li><a href="#contact" data-page="contact" id="nav-contact">Kontakt</a></li>
                <li><a href="#newsletter" data-page="newsletter" id="nav-newsletter">Newsletter</a></li>
                <li><a href="#about" data-page="about" id="nav-about">O mnie</a></li>
                <li><a href="#test" data-page="test" id="nav-test">Test</a></li>
            </ul>
            <!-- CMS_NAV_END -->
        </nav>

        <!-- CMS_PAGES_START -->
<div id="page-home" class="page-section active-section>
    {% include "pages/home.liquid" %}
</div>

<div id="page-contact" class="page-section>
    {% include "pages/contact.liquid" %}
</div>

<div id="page-newsletter" class="page-section>
    {% include "pages/newsletter.liquid" %}
</div>

<div id="page-about" class="page-section>
    {% include "pages/about.liquid" %}
</div>

<div id="page-test" class="page-section>
    {% include "pages/test.liquid" %}
</div>
<!-- CMS_PAGES_END -->

    </div>
    <div id="lightbox" class="lightbox-overlay" aria-hidden="true">
    <button type="button" class="lightbox-close" aria-label="Zamknij podgląd zdjęcia">&times;</button>
    <img id="lightboxImg" src="" alt="Powiększenie zdjęcia">
</div>
    <script src="/js/main.js" defer></script>
    <script src="/js/newsletter.js" defer></script>
</body>
</html>
